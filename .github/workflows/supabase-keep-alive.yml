name: Keep Supabase Alive

# Supabase pauses Free Plan projects with too little database activity over
# 7 days. Three layers keep this one up:
#
# 1. A real write: record_keepalive_ping() updates a one-row table
#    (supabase/migrations/20260908120000_keepalive_ping.sql). A plain anon
#    SELECT didn't reset the timer in practice.
# 2. Two schedulers. GitHub runs scheduled jobs on a best-effort basis (they
#    land hours late here, and can be dropped) and disables them in a public
#    repo after 60 days without commits, so this runs three times a day, and
#    Vercel Cron also hits /api/keepalive daily (vite.config.ts).
# 3. Self-healing. If the ping still fails and the project turns out to be
#    paused, this job restores it through the Management API, as long as the
#    SUPABASE_ACCESS_TOKEN secret is set. It fails the run either way, so
#    GitHub emails you.

on:
  schedule:
    - cron: '7 2,10,18 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      # Retry for ~5 minutes so a one-off 504 doesn't fail the run.
      - name: Write a heartbeat row via RPC
        id: ping
        continue-on-error: true
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 60 --retry-all-errors \
            -o /dev/null -w "record_keepalive_ping responded with HTTP %{http_code}\n" \
            -X POST "${SUPABASE_URL}/rest/v1/rpc/record_keepalive_ping" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}'

      - name: Restore the project if it was paused
        if: steps.ping.outcome == 'failure'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::The ping failed and there's no SUPABASE_ACCESS_TOKEN secret, so the project can't be restored automatically. Restore it from the Supabase dashboard."
            exit 1
          fi

          # https://<ref>.supabase.co -> <ref>
          ref=$(echo "$SUPABASE_URL" | sed -E 's#^https?://([^.]+)\..*#\1#')
          api="https://api.supabase.com/v1/projects/${ref}"
          status=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" "$api" | jq -r .status)
          echo "Project status: ${status}"

          if [ "$status" = "INACTIVE" ]; then
            curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" "${api}/restore"
            echo "::warning::The project was paused. Restore requested; it takes a few minutes to come back."
          else
            echo "::error::The ping failed but the project isn't paused (status ${status}). Check the Supabase dashboard."
          fi
          exit 1
