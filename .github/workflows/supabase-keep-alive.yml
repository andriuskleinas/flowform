name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 12 */5 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" "${SUPABASE_URL}/rest/v1/" -H "apikey: ${SUPABASE_ANON_KEY}")
          echo "Supabase REST API responded with HTTP $status"
          if [ "$status" != "200" ]; then
            echo "Unexpected response from Supabase"
            exit 1
          fi
